<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YASSIRE Mehdi - ID Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Futura, Trebuchet MS, Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        .id-card {
            width: 350px;
            height: 550px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .top-section {
            height: 200px;
            background: linear-gradient(-45deg, #7BBEE9, #5ba8d8, #4a9ed0, #3a94c7);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
            overflow: hidden;
        }
        
        /* Add animated bubbles in the background */
        .top-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 70%);
            background-size: 20px 20px;
            animation: bubbleMove 8s linear infinite;
        }
        
        @keyframes bubbleMove {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 100% 100%;
            }
        }
        
        .photo-top {
            width: 150px;
            height: 150px;
            border: 4px solid white;
            border-radius: 50%;
            background-image: url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/301398888_616379406719554_9043157010673887999_n-JBXeXFFKKxKEtUDW8OujBvthoqYYu3.png');
            background-size: cover;
            background-position: center top;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        
        .details {
            margin-top: 20px;
            text-align: center;
            padding: 0 20px;
        }
        
        .name {
            font-size: 32px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: baseline;
        }
        
        .name-first {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .name-last {
            font-weight: normal;
        }
        
        .designation {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
            font-style: italic;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        
        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .social-icon {
            width: 40px;
            height: 40px;
            background-color: #7BBEE9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .social-icon:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            background-color: #5ba8d8;
        }
        
        .social-label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .threads-logo {
            width: 20px;
            height: 20px;
            filter: invert(1);
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .contact-icon {
            width: 30px;
            height: 30px;
            background-color: #7BBEE9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .blue-line {
            height: 3px;
            background-color: #7BBEE9;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="id-card">

            <div class="photo-top"></div>
        </div>
        
        <div class="details">
            <div class="name">

            </div>
            <div class="designation">Directeur artistique et concepteur-rédacteur</div>
            
            <div class="social-icons">
                <div class="social-item">
                    <a href="https://www.instagram.com/koman_mehdi/?hl=en" class="social-icon" target="_blank">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <span class="social-label">Instagram</span>
                </div>
                
                <div class="social-item">
                    <a href="https://www.facebook.com/Koman.Mehdi/?locale=fr_FR" class="social-icon" target="_blank">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <span class="social-label">Facebook</span>
                </div>
                
                <div class="social-item">
                    <a href="https://www.youtube.com/@MehdiKoman" class="social-icon" target="_blank">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <span class="social-label">YouTube</span>
                </div>
                
                <div class="social-item">
                    <a href="https://www.threads.com/@koman_mehdi?xmt=AQGzTjuquz6hR8Wq3sPwZ20BUXN7Co795aYo3N2Eh6_Bf24" class="social-icon" target="_blank">
                        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Threads_%28app%29_logo.svg-MXOAOiCR6AwUx9n2JDM1NG6rRZ3bXm.png" alt="Threads" class="threads-logo">
                    </a>
                    <span class="social-label">Threads</span>
                </div>
            </div>
            
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    mehdi.yassire@gmail.com
                </div>
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    065 66 38 44
                </div>
            </div>
        </div>
        
        <div class="blue-line"></div>
    </div>
</body>
</html>
